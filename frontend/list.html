<!DOCTYPE html>
<html>
    <title> lists in html</title>
    <body>
        <h1> lists in html </h1>
        <br>
        <h2> unordered list</h2>
        <ul>
            <li> apple</li>
            <li> banana</li>
            <li> orange</li>
            <li> mango</li>
            <ul>
                <li> <span style="color: rgb(192, 189, 15);"> <b>shake</b></span></li>
                <li> <span style="color: rgb(192, 189, 15);"> <b>icecream</b></span></li>
            </ul>
        </ul>
        <br>
        <h2> ordered list</h2>
        <ol>
            <li>apple</li>
            <li>banana</li>
            <li>orange</li>
            <li>mango</li>

        </ol>
        <br>
        <h2 style="background-color: aquamarine;"> description list</h2>
        <dl style="background-color: rgb(176, 102, 107); border: 2px solid black; border-radius: 10px; padding: 10px;">
            <dt>apple</dt>
            <dd> a fruit</dd>
            <dt>banana</dt>
            <dd> a fruit</dd>
            <dt>orange</dt>
            <dd> a fruit</dd>
            <dt>mango</dt>
            <dd> a fruit</dd>

    </body>
</html>
